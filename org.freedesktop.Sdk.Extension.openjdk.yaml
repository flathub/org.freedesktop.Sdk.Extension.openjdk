id: org.freedesktop.Sdk.Extension.openjdk
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false
cleanup:
  - /share/info
  - /share/man
build-options:
  no-debuginfo: true
  strip: true
  prefix: /usr/lib/sdk/openjdk
  env:
    V: '1'
modules:
  - name: bootstrap_jdk
    buildsystem: simple
    cleanup:
      - '*'
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2%2B12/OpenJDK24U-jdk_x64_linux_hotspot_24.0.2_12.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: 99b8c6f7125e1cb6cd252805f9db7779edf161c4908f7c523d9c6746aa7487f008ce0900bf5244fecfc3a34702201a1b94fd4aaa86cb3958216c4f872d9e824d
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/24/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].version.semver
          url-query: .[0].binary.package.link
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin24-binaries/releases/download/jdk-24.0.2%2B12/OpenJDK24U-jdk_aarch64_linux_hotspot_24.0.2_12.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: 9de3c9aacccbdfb7b3bb1a400fb2ffc78165291816d8cdea92dad0da6756b38abaf21e09fcdba181a8bd227ee4f87779c22b7e58f8d399f02dc2023a6068cec3
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/24/hotspot?os=linux&architecture=aarch64&image_type=jdk
          version-query: .[0].version.semver
          url-query: .[0].binary.package.link
    build-commands:
      - mkdir -p $FLATPAK_DEST/bootstrap-java
      - tar xf java-openjdk.tar.bz2 --strip-components=1 --directory=$FLATPAK_DEST/bootstrap-java
  - name: java
    buildsystem: autotools
    no-make-install: true
    no-parallel-make: true
    config-opts:
      - --with-boot-jdk=/usr/lib/sdk/openjdk/bootstrap-java
      - --with-jvm-variants=server
      - --with-version-build=12
      - --with-version-pre=
      - --with-version-opt=
      - --with-vendor-version-string=25.8
      - --with-vendor-name=Flathub
      - --with-vendor-url=https://flathub.org
      - --with-vendor-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk/issues
      - --with-debug-level=release
      - --with-native-debug-symbols=internal
      - --enable-unlimited-crypto
      - --with-zlib=system
      - --with-libjpeg=system
      - --with-giflib=system
      - --with-libpng=system
      - --with-lcms=system
      - --with-harfbuzz=system
      - --with-stdc++lib=dynamic
      - --with-extra-cxxflags=-grecord-gcc-switches -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS
        -fstack-protector-strong -fasynchronous-unwind-tables -fstack-clash-protection
      - --with-extra-cflags=-grecord-gcc-switches -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS
        -fstack-protector-strong -fasynchronous-unwind-tables -fstack-clash-protection
      - --with-extra-ldflags=-Wl,-z,relro -Wl,-z,now -Wl,--as-needed
      - --disable-javac-server
      - --disable-warnings-as-errors
    make-args:
      - LOG=info
      - images
    post-install:
      - mkdir -p $FLATPAK_DEST/jvm/ $FLATPAK_DEST/bin
      - cp -Lr build/linux-*-server-release/images/jdk $FLATPAK_DEST/jvm/openjdk-24
      - ln -s $FLATPAK_DEST/jvm/openjdk-24/bin/* $FLATPAK_DEST/bin
    sources:
      - type: archive
        url: https://github.com/openjdk/jdk24u/archive/refs/tags/jdk-24.0.2+12.tar.gz
        sha512: fa3457d69279db37204d829b6637aec541dc76f58574c31b6c7da5cb2758f87d759065cf77e97cded964385887ce9ee859fd81b609efcd490319a774821fe79b
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/24/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].release_name
          url-query: '"https://github.com/openjdk/jdk24u/archive/refs/tags/" + $version
            + ".tar.gz"'
          is-main-source: true
      - type: shell
        commands:
          - chmod a+x configure
          - sed -i -e "s|@prefix@|$FLATPAK_DEST|" make/autoconf/spec.gmk.template
      - type: patch
        paths:
          - patches/0001-Allow-ccache-to-be-handled-by-GCC-wrappers.patch
          - patches/0002-Build-failure-with-glibc-2.42-due-to-uabs-name.patch
  - name: cacerts
    buildsystem: simple
    sources:
      - type: file
        path: extract_cacerts.sh
    build-commands:
      - ./extract_cacerts.sh $FLATPAK_DEST/jvm/openjdk-24
  - name: ant
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/ant/binaries/apache-ant-1.10.15-bin.tar.gz
        dest-filename: apache-ant-bin.tar.gz
        sha512: d78427aff207592c024ff1552dc04f7b57065a195c42d398fcffe7a0145e8d00cd46786f5aa52e77ab0fdf81334f065eb8011eecd2b48f7228e97ff4cb20d16c
        x-checker-data:
          type: anitya
          project-id: 50
          stable-only: true
          url-template: http://archive.apache.org/dist/ant/binaries/apache-ant-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/ant
      - tar xf apache-ant-bin.tar.gz --strip-components=1 --directory=$FLATPAK_DEST/ant
      - ln -s $FLATPAK_DEST/ant/bin/ant $FLATPAK_DEST/bin
  - name: maven
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jansi-native
        --directory=$FLATPAK_DEST/maven
      - ln -s $FLATPAK_DEST/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin
  - name: gradle
    buildsystem: simple
    cleanup:
      - '*.bat'
    sources:
      - type: file
        url: https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
        dest-filename: gradle-bin.zip
        sha512: 4210dd9c4f9d987e1349ee9c238eec9893eb4429a9d44ac96174530a6516fb87f0db70cd2c591d5df07ef67db46d8a5f70eb0e1bcd236b9c806973019101f687
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gradle/gradle/releases
          version-query: map(select(.prerelease == false)) | first | .name
          url-query: '["https://services.gradle.org/distributions/gradle-" + $version
            + "-bin.zip"][0]'
    build-commands:
      - unzip -q gradle-bin.zip -d $FLATPAK_DEST
      - mv $FLATPAK_DEST/gradle-* $FLATPAK_DEST/gradle
      - ln -s $FLATPAK_DEST/gradle/bin/gradle $FLATPAK_DEST/bin
  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - mkdir -p /app/jre/bin
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-24
          - cp -ra conf lib release /app/jre/
          - rm /app/jre/lib/src.zip /app/jre/lib/ct.sym
          - cp -ra bin/{java,keytool,rmiregistry} /app/jre/bin
        dest-filename: install.sh
      - type: script
        commands:
          - mkdir -p /app/jdk/
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-24
          - cp -ra bin conf include jmods lib release /app/jdk/
        dest-filename: installjdk.sh
      - type: script
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk/jvm/openjdk-24
          - export PATH=$PATH:/usr/lib/sdk/openjdk/bin
        dest-filename: enable.sh
    build-commands:
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk/
  - name: appdata
    buildsystem: simple
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.appdata.xml
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - cp org.freedesktop.Sdk.Extension.openjdk.appdata.xml ${FLATPAK_DEST}/share/metainfo
