id: org.freedesktop.Sdk.Extension.openjdk
branch: '26.08'
runtime: org.freedesktop.Sdk
runtime-version: '26.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false

cleanup:
  - /share/info
  - /share/man

build-options:
  no-debuginfo: true
  strip: true
  prefix: /usr/lib/sdk/openjdk

modules:
  # Boot JDK requirements: https://htmlpreview.github.io/?https://raw.githubusercontent.com/openjdk/jdk/master/doc/building.html#boot-jdk-requirements
  - name: bootstrap_jdk
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/bootstrap-java
      - tar xf java-openjdk.tar.bz2 --strip-components=1 --directory=$FLATPAK_DEST/bootstrap-java
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26%2B35/OpenJDK26U-jdk_x64_linux_hotspot_26_35.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: eb03f3360f1fef6832682431f447204085afded2faa7a751f13748518a84413d6739b384697849e90b237a03ef3a35da8b640490cc728adaffedc46b3057fbfe
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin26-binaries/releases/download/jdk-26%2B35/OpenJDK26U-jdk_aarch64_linux_hotspot_26_35.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: 5937a0a4132743c5097d3db120e9175a40e882ea992f063c074f4c5372406b7960406aea094b778a5178e9267662b83b6066585edf9e4077425892c541d5ed26
    cleanup:
      - '*'

  - name: java
    buildsystem: simple
    build-commands:
      - |
        bash configure \
           --with-boot-jdk=/usr/lib/sdk/openjdk/bootstrap-java \
           --with-jvm-variants=server \
           --with-version-pre= \
           --with-version-opt= \
           --with-vendor-version-string=26.08 \
           --with-vendor-name=Flathub \
           --with-vendor-url=https://flathub.org \
           --with-vendor-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk/issues \
           --with-vendor-vm-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk/issues \
           --with-debug-level=release \
           --with-native-debug-symbols=internal \
           --enable-unlimited-crypto \
           --with-zlib=system \
           --with-libjpeg=system \
           --with-giflib=system \
           --with-libpng=system \
           --with-lcms=system \
           --with-harfbuzz=system \
           --with-stdc++lib=dynamic \
           --with-extra-cflags="${CFLAGS}" \
           --with-extra-cxxflags="${CXXFLAGS}" \
           --with-extra-ldflags="${LDFLAGS}" \
           --disable-javac-server \
           --disable-warnings-as-errors
      - make -j1 LOG=info images
      - mkdir -p $FLATPAK_DEST/jvm $FLATPAK_DEST/bin
      - cp -Lr build/linux-*-server-release/images/jdk $FLATPAK_DEST/jvm/openjdk-27
      - ln -sr $FLATPAK_DEST/jvm/openjdk-27/bin/* $FLATPAK_DEST/bin
    sources:
      - type: archive
        url: https://github.com/openjdk/jdk27u/archive/refs/tags/jdk-27+35.tar.gz
        sha512: 73c92ff127014357db4bf12f8c543e47cc6ea26893381eed617827c02edd68d43f99fea0524a183c7bb7135dac2b962a06a37fe2ed9efb75d36847760eee276a
        x-checker-data:
          is-main-source: true
          type: json
          url: https://api.adoptium.net/v3/assets/latest/27/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].release_name
          url-query: '"https://github.com/openjdk/jdk27u/archive/refs/tags/" + $version
            + ".tar.gz"'
      - type: patch
        paths:
          - patches/0001-Allow-ccache-to-be-handled-by-GCC-wrappers.patch
          - patches/0002-Fix-libjvm.so-linking-error.patch

  - name: cacerts
    buildsystem: simple
    build-commands:
      - ./extract_cacerts.sh $FLATPAK_DEST/jvm/openjdk-27
    sources:
      - type: file
        path: extract_cacerts.sh

  # Java version requirements for Ant: https://ant.apache.org/faq.html#java-version
  - name: ant
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/ant
      - tar xf apache-ant-bin.tar.gz --strip-components=1 --directory=$FLATPAK_DEST/ant
      - ln -sr $FLATPAK_DEST/ant/bin/ant $FLATPAK_DEST/bin
    sources:
      - type: file
        url: http://archive.apache.org/dist/ant/binaries/apache-ant-1.10.18-bin.tar.gz
        dest-filename: apache-ant-bin.tar.gz
        sha512: c510d744876d8da48dabc9495b023b6ec5284a0f18b40ee50d98ce099e791ca5c73e3cd4c80d3c90d3efc03f9620be43aad0a373ed47198284f7e3373e0db2c3
        x-checker-data:
          type: anitya
          project-id: 50
          stable-only: true
          url-template: http://archive.apache.org/dist/ant/binaries/apache-ant-$version-bin.tar.gz
    cleanup:
      - '*.bat'
      - '*.cmd'

  # Java version requirements for Maven: https://maven.apache.org/docs/history.html
  - name: maven
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jline-native
        --directory=$FLATPAK_DEST/maven
      - ln -sr $FLATPAK_DEST/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: 908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
    cleanup:
      - '*.bat'
      - '*.cmd'

  # Java version requirements for Gradle: https://docs.gradle.org/current/userguide/compatibility.html#java_runtime
  - name: gradle
    buildsystem: simple
    build-commands:
      - unzip -q gradle-bin.zip -d $FLATPAK_DEST
      - mv $FLATPAK_DEST/gradle-* $FLATPAK_DEST/gradle
      - ln -sr $FLATPAK_DEST/gradle/bin/gradle $FLATPAK_DEST/bin
    sources:
      - type: file
        url: https://services.gradle.org/distributions/gradle-9.8.1-bin.zip
        dest-filename: gradle-bin.zip
        sha512: f11f3fdb96f03fdf3b4d463048a73daddc6afd8c53229fb3d2684a0e88c4714b4453386034b156392aef2d84b0aa9429abd3970d587983e307518acef2015472
        x-checker-data:
          type: anitya
          project-id: 6088
          stable-only: true
          url-template: https://services.gradle.org/distributions/gradle-$version-bin.zip
    cleanup:
      - '*.bat'

  - name: scripts
    buildsystem: simple
    build-commands:
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk
    sources:
      - type: script
        dest-filename: install.sh
        commands:
          - mkdir -p /app/jre/bin
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-27
          - cp -ra conf lib release /app/jre
          - rm /app/jre/lib/src.zip /app/jre/lib/ct.sym
          - cp -ra bin/{java,keytool,rmiregistry} /app/jre/bin
      - type: script
        dest-filename: installjdk.sh
        commands:
          - mkdir -p /app/jdk
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-27
          - cp -ra bin conf include jmods lib release /app/jdk
      - type: script
        dest-filename: enable.sh
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk/jvm/openjdk-27
          - export PATH=$PATH:/usr/lib/sdk/openjdk/bin

  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.appdata.xml
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.appdata.xml
