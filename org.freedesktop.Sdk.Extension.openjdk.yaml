id: org.freedesktop.Sdk.Extension.openjdk
branch: '24.08'
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
build-extension: true
sdk: org.freedesktop.Sdk
separate-locales: false
cleanup:
  - /share/info
  - /share/man
build-options:
  no-debuginfo: true
  strip: true
  build-args:
    - --share=network # Needed to build jdt-language-server (lots of maven dependencies)
  prefix: /usr/lib/sdk/openjdk
  prepend-path: /usr/lib/sdk/openjdk/jvm/openjdk-22/bin:/usr/lib/sdk/openjdk/extensions/maven/bin
  prepend-ld-library-path: /usr/lib/sdk/openjdk/jvm/openjdk-22/lib
  env:
    V: '1'
add-extensions:
  org.freedesktop.Sdk.Extension.openjdk.plugins:
    directory: extensions
    subdirectories: true
    no-autodownload: false # This should change to true sometime
    autodelete: true
  org.freedesktop.Sdk.Extension.openjdk.plugins.openjfx:
    version: '24.08'
    directory: extensions/openjfx
    bundle: true
    autodelete: true
    no-autodownload: true
  org.freedesktop.Sdk.Extension.openjdk.plugins.maven:
    version: '24.08'
    directory: extensions/maven
    bundle: true
    autodelete: true
    no-autodownload: false
  org.freedesktop.Sdk.Extension.openjdk.plugins.gradle:
    version: '24.08'
    directory: extensions/gradle
    bundle: true
    autodelete: true
    no-autodownload: false
  org.freedesktop.Sdk.Extension.openjdk.plugins.ant:
    version: '24.08'
    directory: extensions/ant
    bundle: true
    autodelete: true
    no-autodownload: false
  org.freedesktop.Sdk.Extension.openjdk.plugins.jdt-language-server:
    version: '24.08'
    directory: extensions/jdt-language-server
    bundle: true
    autodelete: true
    no-autodownload: true
  
cleanup-commands:
  - mkdir --parents /usr/lib/sdk/openjdk/extensions
modules:
  - name: bootstrap_jdk
    buildsystem: simple
    cleanup:
      - '*'
    sources:
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/adoptium/temurin23-binaries/releases/download/jdk-23.0.1%2B11/OpenJDK23U-jdk_x64_linux_hotspot_23.0.1_11.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: bcfc8ea1d835afcfbafc9f99c9e897588bf01e219dda936a4bda7e4982ff0b2cc2f21f5e3deadb0e1cf86a9a58295a25f8f82f9fadd2eab520817350a6a862c1
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/23/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].version.semver
          url-query: .[0].binary.package.link
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/adoptium/temurin23-binaries/releases/download/jdk-23.0.1%2B11/OpenJDK23U-jdk_aarch64_linux_hotspot_23.0.1_11.tar.gz
        dest-filename: java-openjdk.tar.bz2
        sha512: 2bc1d9e3a2741e1359915a2479b6f09a3877a6fbb9e358e01e0e5305585c3b974a7847da08857692bc2a65e9dadc77b443739ad1d963941ded37ea97ab8329a0
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/23/hotspot?os=linux&architecture=aarch64&image_type=jdk
          version-query: .[0].version.semver
          url-query: .[0].binary.package.link
    build-commands:
      - mkdir -p $FLATPAK_DEST/bootstrap-java
      - tar xf java-openjdk.tar.bz2 --strip-components=1 --directory=$FLATPAK_DEST/bootstrap-java
  - name: java
    buildsystem: autotools
    no-make-install: true
    no-parallel-make: true
    config-opts:
      - --with-boot-jdk=/usr/lib/sdk/openjdk/bootstrap-java
      - --with-jvm-variants=server
      - --with-version-build=11
      - --with-version-pre=
      - --with-version-opt=
      - --with-vendor-version-string=24.9
      - --with-vendor-name=Flathub
      - --with-vendor-url=https://flathub.org
      - --with-vendor-bug-url=https://github.com/flathub/org.freedesktop.Sdk.Extension.openjdk/issues
      - --with-debug-level=release
      - --with-native-debug-symbols=internal
      - --enable-unlimited-crypto
      - --with-zlib=system
      - --with-libjpeg=system
      - --with-giflib=system
      - --with-libpng=system
      - --with-lcms=system
      - --with-harfbuzz=system
      - --with-stdc++lib=dynamic
      - --with-extra-cxxflags=-grecord-gcc-switches -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS
        -fstack-protector-strong -fasynchronous-unwind-tables -fstack-clash-protection
      - --with-extra-cflags=-grecord-gcc-switches -Wp,-D_FORTIFY_SOURCE=2 -Wp,-D_GLIBCXX_ASSERTIONS
        -fstack-protector-strong -fasynchronous-unwind-tables -fstack-clash-protection
      - --with-extra-ldflags=-Wl,-z,relro -Wl,-z,now -Wl,--as-needed
      - --disable-javac-server
      - --disable-warnings-as-errors
    make-args:
      - LOG=info
      - images
    post-install:
      - mkdir -p $FLATPAK_DEST/jvm/ $FLATPAK_DEST/bin
      - cp -Lr build/linux-*-server-release/images/jdk $FLATPAK_DEST/jvm/openjdk-23
      - ln -s $FLATPAK_DEST/jvm/openjdk-23/bin/* $FLATPAK_DEST/bin
    sources:
      - type: archive
        url: https://github.com/openjdk/jdk23u/archive/refs/tags/jdk-23.0.1+11.tar.gz
        sha512: 089c4a8d40fc310b85597aae6fae66951b52a3995602a444e43b173acf7289382fb362b51e53c19466983101d9cbb197922592d720b02f95cedb945adaaccb91
        x-checker-data:
          type: json
          url: https://api.adoptium.net/v3/assets/latest/23/hotspot?os=linux&architecture=x64&image_type=jdk
          version-query: .[0].release_name
          url-query: '"https://github.com/openjdk/jdk23u/archive/refs/tags/" + $version
            + ".tar.gz"'
          is-main-source: true
      - type: shell
        commands:
          - chmod a+x configure
          - sed -i -e "s|@prefix@|$FLATPAK_DEST|" make/autoconf/spec.gmk.template
  - name: cacerts
    buildsystem: simple
    sources:
      - type: file
        path: extract_cacerts.sh
    build-commands:
      - ./extract_cacerts.sh $FLATPAK_DEST/jvm/openjdk-23
  - name: ant
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/ant/binaries/apache-ant-1.10.15-bin.tar.gz
        dest-filename: apache-ant-bin.tar.gz
        sha512: d78427aff207592c024ff1552dc04f7b57065a195c42d398fcffe7a0145e8d00cd46786f5aa52e77ab0fdf81334f065eb8011eecd2b48f7228e97ff4cb20d16c
        x-checker-data:
          type: anitya
          project-id: 50
          stable-only: true
          url-template: http://archive.apache.org/dist/ant/binaries/apache-ant-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/extensions/ant
      - tar xf apache-ant-bin.tar.gz --strip-components=1 --directory=$FLATPAK_DEST/extensions/ant
        #- ln -s $FLATPAK_DEST/extensions/ant/bin/ant $FLATPAK_DEST/bin
  - name: maven
    buildsystem: simple
    cleanup:
      - '*.bat'
      - '*.cmd'
    sources:
      - type: file
        url: http://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
        dest-filename: apache-maven-bin.tar.gz
        sha512: a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b
        x-checker-data:
          type: anitya
          project-id: 1894
          stable-only: true
          url-template: http://archive.apache.org/dist/maven/maven-3/$version/binaries/apache-maven-$version-bin.tar.gz
    build-commands:
      - mkdir -p $FLATPAK_DEST/extensions/maven
      - tar xf apache-maven-bin.tar.gz --strip-components=1 --exclude=jansi-native
        --directory=$FLATPAK_DEST/extensions/maven
        #- ln -s $FLATPAK_DEST/extensions/maven/bin/mvn $FLATPAK_DEST/maven/bin/mvnDebug $FLATPAK_DEST/bin
  - name: gradle
    buildsystem: simple
    cleanup:
      - '*.bat'
    sources:
      - type: file
        url: https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
        dest-filename: gradle-bin.zip
        sha512: c48d4b7f4a7b6aa4886848ce913b099b8b7f2494b3d0ca86a21588f6482a185265fffeb0bb6da5f52b8c5f958e589d3a8be9c7fd846790ffbe12be1ad05c9f4f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/gradle/gradle/releases
          version-query: map(select(.prerelease == false)) | first | .name
          url-query: '["https://services.gradle.org/distributions/gradle-" + $version
            + "-bin.zip"][0]'
    build-commands:
      - unzip -q gradle-bin.zip -d $FLATPAK_DEST
      - mkdir --parents $FLATPAK_DEST/extensions/gradle
      - mv $FLATPAK_DEST/gradle-*/* $FLATPAK_DEST/extensions/gradle
        #- ln -s $FLATPAK_DEST/extensions/gradle/bin/gradle $FLATPAK_DEST/bin
  - name: openjfx
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/extensions/openjfx
      - cp -r ./ $FLATPAK_DEST/extensions/openjfx
    sources:
      - type: archive
        url: https://download2.gluonhq.com/openjfx/18.0.2/openjfx-18.0.2_linux-aarch64_bin-sdk.zip
        sha256: c5b507b5c6fc1adf8b66591e79c6c34b6afa78b5cb4c2f1c6cb200f8940b402c
        only-arches: [aarch64]
        x-checker-data:
          type: anitya
          project-id: 176095
          stable-only: true
          url-template: https://download2.gluonhq.com/openjfx/$major.$minor.$patch/openjfx-$major.$minor.${patch}_linux-aarch64_bin-sdk.zip
          versions: {<: 19.0.0, '>=': 18.0.0, '!=': 18.0.2+0}
      - type: archive
        url: https://download2.gluonhq.com/openjfx/18.0.2/openjfx-18.0.2_linux-x64_bin-sdk.zip
        sha256: e9d4b119efc65f5a9ca7f6a4ca74b579eb212f7126f91d5f4033fd90f74d1701
        only-arches: [x86_64]
        x-checker-data:
          type: anitya
          project-id: 176095
          stable-only: true
          url-template: https://download2.gluonhq.com/openjfx/$major.$minor.$patch/openjfx-$major.$minor.${patch}_linux-x64_bin-sdk.zip
          versions: {<: 19.0.0, '>=': 18.0.0, '!=': 18.0.2+0}
      - type: archive
        url: https://download2.gluonhq.com/openjfx/18.0.2/openjfx-18.0.2_linux-arm32_bin-sdk.zip
        sha256: d8a28a81ac18cd4f4485a502d2ba0f5a31828fe43cfa376e699cddc66aa9429a
        only-arches: [arm]
        x-checker-data:
          type: anitya
          project-id: 176095
          stable-only: true
          url-template: https://download2.gluonhq.com/openjfx/$major.$minor.$patch/openjfx-$major.$minor.${patch}_linux-arm32_bin-sdk.zip
          versions: {<: 19.0.0, '>=': 18.0.0, '!=': 18.0.2+0}

  - name: scripts
    buildsystem: simple
    sources:
      - type: script
        commands:
          - mkdir -p /app/jre/bin
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-23
          - cp -ra conf lib release /app/jre/
          - rm /app/jre/lib/src.zip /app/jre/lib/ct.sym
          - cp -ra bin/{java,keytool,rmiregistry} /app/jre/bin
          - if [ -d '/usr/lib/sdk/openjdk/extensions/openjfx' ]; then
          -    cp -ra /usr/lib/sdk/openjdk/extensions/openjfx/lib/ /app/share/openjfx/lib
          - elif [ -d '/usr/lib/sdk/openjdk.plugins.openjfx' ]; then
          -    cp -ra /usr/lib/sdk/openjdk.plugins.openjfx/lib/ /app/share/openjfx/lib
          - fi
        dest-filename: install.sh
      - type: script
        commands:
          - mkdir -p /app/jdk/
          - cd /usr/lib/sdk/openjdk/jvm/openjdk-23
          - cp -ra bin conf include jmods lib release /app/jdk/
          - for i in "ant" "gradle" "maven" "openjfx"; do
          - if [ -d "/usr/lib/sdk/openjdk/extensions/${i}" ]; then
          -    cp -ra "/usr/lib/sdk/openjdk/extensions/${i}/" "/app/jdk/${i}"
          - elif [ -d "/usr/lib/sdk/openjdk.plugins.${i}" ]; then
          -    cp -ra "/usr/lib/sdk/openjdk.plugins.${i}/" "/app/jdk/${i}"
          - fi
          - done
        dest-filename: installjdk.sh
      - type: script
        commands:
          - export JAVA_HOME=/usr/lib/sdk/openjdk/jvm/openjdk-23
          - export PATH=$PATH:/usr/lib/sdk/openjdk/bin
          - for i in "ant" "gradle" "maven"; do
          - if [ -d "/usr/lib/sdk/openjdk/extensions/${i}" ]; then
          -    export PATH="${PATH}:/usr/lib/sdk/openjdk/extensions/${i}/bin"
          - elif [ -d "/usr/lib/sdk/openjdk.plugins.${i}" ]; then
          -    export PATH="${PATH}:/usr/lib/sdk/openjdk.plugins.${i}/bin"
          - fi
          - if [ -d '/usr/lib/sdk/openjdk/extensions/openjfx' ]; then
          -    export JAVAFX_HOME="/usr/lib/sdk/openjdk/extensions/openjfx/lib"
          - elif [ -d '/usr/lib/sdk/openjdk.plugins.openjfx' ]; then
          -    export JAVAFX_HOME="/usr/lib/sdk/openjdk.plugins.openjfx/lib"
          - fi
          - done
        dest-filename: enable.sh
    build-commands:
      - cp enable.sh install.sh installjdk.sh /usr/lib/sdk/openjdk/
  - name: jdt-language-server
    buildsystem: simple
    build-commands:
      - source /usr/lib/sdk/openjdk/enable.sh
      - echo $PATH
      - mvn clean verify -DskipTests=true
      - mkdir -p $FLATPAK_DEST/extensions/jdt-language-server
      - cp -r ./org.eclipse.jdt.ls.product/target/repository/* $FLATPAK_DEST/extensions/jdt-language-server
    sources:
      - type: git
        url: https://github.com/eclipse-jdtls/eclipse.jdt.ls.git
        commit: 494042b71bb5b23578d58c44969863117b648b75
        x-checker-data:
          type: git
          tag-pattern: "^v([\\d.]+)$"

  - name: appdata
    buildsystem: simple
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.metainfo.xml
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.plugins.ant.metainfo.xml
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.plugins.gradle.metainfo.xml
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.plugins.maven.metainfo.xml
      - type: file
        path: org.freedesktop.Sdk.Extension.openjdk.plugins.openjfx.metainfo.xml
    build-commands:
      - mkdir -p ${FLATPAK_DEST}/share/metainfo
      - cp org.freedesktop.Sdk.Extension.openjdk.metainfo.xml ${FLATPAK_DEST}/share/metainfo
      - cp org.freedesktop.Sdk.Extension.openjdk.plugins.openjfx.metainfo.xml ${FLATPAK_DEST}/share/metainfo
